[project]
name = "heimdall"
version = "0.1.0"
description = "Heimdall multimodal examination-integrity monitoring — audio module"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    # Phase 6: the live webcam heatmap. Wheels are self-contained; nothing is
    # downloaded at runtime and no network access is ever required.
    "opencv-python>=4.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
